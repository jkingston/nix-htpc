[project]
name = "pier"
version = "0.1.0"
description = "HTPC game management tool - ROMs, ports, and Steam integration"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.47.0",
    "httpx>=0.27.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "pillow>=10.0.0",
]

[project.scripts]
pier = "pier.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pier"]
